{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Wishlist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'home' %}">
            🛒 My Website
        </a>

        <div>

            <a class="nav-link d-inline-block text-white"
               href="{% url 'home' %}">
                🏠 Home
            </a>

            <a class="nav-link d-inline-block text-white"
               href="{% url 'cart' %}">
                🛒 Cart
            </a>

            <a class="nav-link d-inline-block text-white"
               href="{% url 'logout' %}">
                🚪 Logout
            </a>

        </div>

    </div>

</nav>


<h1 class="text-center mt-4">
    ❤️ My Wishlist
</h1>


<div class="products">

    {% for product in products %}

        <div class="card">

            <img src="{% static 'images/' %}{{ product.image }}"
                 alt="{{ product.name }}">

            <h3>{{ product.name }}</h3>

            <p>
                <b>Category:</b> {{ product.category }}
            </p>

            <p class="price">
                ₹{{ product.price }}
            </p>

            <a href="{% url 'add_to_cart' product.id %}"
               class="btn">
                🛒 Add To Cart
            </a>

        </div>

    {% empty %}

        <div class="text-center">

            <h3>Your wishlist is empty ❤️</h3>

            <a href="{% url 'home' %}"
               class="btn">
                Continue Shopping
            </a>

        </div>

    {% endfor %}

</div>


</body>

</html>
